<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BeePlus for Beekeeper</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="sb-brand" href="#/">
        <img src="icons/icon48.png" alt="" width="36" height="36">
        <span class="sb-brand-text">
          <strong>BeePlus</strong>
          <span data-t="brandSub">for Beekeeper by LumApps</span>
        </span>
      </a>
      <nav class="sb-nav" id="nav"></nav>
      <div class="sb-footer">
        <div class="lang-seg" id="langSeg" role="group">
          <span class="lang-seg-icon" id="langIcon"></span>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="de" lang="de">DE</button>
        </div>
        <div class="sb-meta">v<span id="versionDisplay"></span> · LUPZN</div>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>

  <script src="core/i18n.js"></script>
  <script src="core/ui-kit.js"></script>
  <script src="core/options-registry.js"></script>
  <script src="features/profile-hover/options-ui.js"></script>
  <script src="features/sticky-pin/options-ui.js"></script>
  <script src="features/theme-engine/options-ui.js"></script>
  <script src="features/quick-polls/options-ui.js"></script>
  <script src="features/reminder-bot/options-ui.js"></script>
  <script src="features/personal-stats/options-ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
